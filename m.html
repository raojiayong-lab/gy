<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#5a5cf0">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="幼专排版">
<title>贵阳幼专 · 图文排版（手机版）</title>
<style>
:root{
  --bg:#e7ebf6;--canvas:#e5e9f4;
  --line:#e3e8f3;--line-2:#eef1f9;--line-3:#d8dff0;--soft:#f6f8fd;
  --ink:#0f1729;--text:#222b3c;--muted:#78849a;--muted-2:#98a3ba;
  --brand:#5a5cf0;--brand-2:#8b5cf6;--gold:#c99a2e;--gold-2:#a9761a;--danger:#e5534b;
  --sh-1:0 1px 2px rgba(15,23,41,.05);
  --sh-2:0 6px 18px rgba(15,23,41,.1);
  --ring:0 0 0 3px rgba(90,92,240,.16);
  --ease:cubic-bezier(.22,.8,.3,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-size:14px;color:var(--text);overscroll-behavior:none;overflow-x:hidden;
  background:linear-gradient(180deg,#eef1f9,#e5e9f4);
  font-family:"Microsoft YaHei","PingFang SC",Inter,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;border:0;background:none;cursor:pointer}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ───────── 顶栏 ───────── */
.topbar{flex:none;min-width:0;padding:calc(8px + var(--sat)) 12px 0;position:relative;z-index:6;
  background:linear-gradient(180deg,#fff,rgba(255,255,255,.94));
  backdrop-filter:saturate(180%) blur(12px);
  box-shadow:0 1px 0 rgba(15,23,41,.04),0 6px 20px -16px rgba(15,23,41,.35)}
.topbar:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;opacity:.85;
  background:linear-gradient(90deg,transparent 2%,rgba(90,92,240,.5),rgba(201,154,46,.5),rgba(139,92,246,.5),transparent 98%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.bmark{width:36px;height:36px;flex:none;border-radius:11px;overflow:hidden;background:#fff;
  border:1px solid var(--line-3);display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(15,23,41,.08),inset 0 0 0 2px rgba(255,255,255,.9)}
.bmark img{width:100%;height:100%;object-fit:contain;display:block}
.bmeta{flex:1;min-width:0}
.btitle{font-size:13.5px;font-weight:800;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(135deg,#141c30,#2c3552 70%,#3a3f6b);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.bsub{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted-2);margin-top:2px}
.bsub .ex{color:var(--gold-2);background:linear-gradient(135deg,#fdf4de,#f8e5ba);border:1px solid #efd9a8;
  border-radius:5px;padding:0 5px;font-size:9.5px;font-weight:700;line-height:15px}
.iconbtn{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line-3);background:#fff;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(15,23,41,.04);transition:transform .15s var(--ease),border-color .15s,color .15s}
.iconbtn svg{width:17px;height:17px}
.iconbtn:active{transform:scale(.94);border-color:rgba(90,92,240,.5);color:var(--brand)}

/* 分页切换 */
.tabs{display:flex;gap:6px;padding:8px 0 10px}
.tab{flex:1;height:40px;border-radius:12px;background:#f2f5fb;border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);
  transition:background .2s var(--ease),color .2s,border-color .2s,box-shadow .2s}
.tab svg{width:16px;height:16px}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 6px 16px rgba(90,92,240,.3);border-color:transparent}
.tab.on .pill{background:rgba(255,255,255,.24);border-color:transparent;color:#fff}
.pill{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:999px;
  background:#e8ecf6;border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--muted)}
.pill.pop{animation:pillPop .45s var(--ease)}
@keyframes pillPop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

/* ───────── 主体 ───────── */
.stage{flex:1;min-height:0;min-width:0;display:flex;overflow:hidden}
.view{display:none;flex:1;min-height:0;min-width:0;flex-direction:column}
.view.on{display:flex}

/* ───────── 正文页 ───────── */
.doc-scroll{flex:1;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 18px;
  background:radial-gradient(700px 240px at 50% -120px,rgba(90,92,240,.1),transparent 72%),linear-gradient(180deg,#eaeef8,#e3e8f3)}
.doc{
  --bfont:'仿宋_GB2312','FangSong','仿宋',serif;--bsize:16pt;--bline:28pt;--bindent:2;
  width:100%;min-height:100%;padding:24px 17px 34px;background:#fff;border-radius:5px;outline:0;color:#000;
  font-family:var(--bfont);
  -webkit-user-select:text;user-select:text;
  box-shadow:0 0 0 1px rgba(15,23,41,.05),0 10px 26px -8px rgba(15,23,41,.14),0 30px 60px -34px rgba(15,23,41,.4);
  transition:box-shadow .22s}
.doc.enter{animation:paperIn .45s var(--ease)}
@keyframes paperIn{from{opacity:.45;transform:translateY(6px)}to{opacity:1;transform:none}}
.doc:focus{box-shadow:0 0 0 1px rgba(90,92,240,.25),0 0 0 4px rgba(90,92,240,.12),0 10px 26px -8px rgba(15,23,41,.14)}
.doc:empty:before{content:attr(data-ph);color:#aeb7c8;font-family:"Microsoft YaHei",sans-serif;font-size:13.5px;line-height:1.85}
.doc p,.doc li,.doc blockquote,.doc h2,.doc h3,.doc h4{
  font-family:var(--bfont);font-size:var(--bsize);line-height:var(--bline);margin:0;overflow-wrap:anywhere;
  text-indent:calc(var(--bindent) * 1em);color:#000}
.doc h1{font-family:var(--bfont);font-size:22pt;overflow-wrap:anywhere;font-weight:700;text-align:center;text-indent:0;margin:0 0 20pt;line-height:var(--bline)}
.doc .cen{text-align:center;text-indent:0}
.doc .rig{text-align:right;text-indent:0}
.doc .flush{text-indent:0}
.doc img{max-width:100%;height:auto;display:block;margin:14pt auto}
.doc img.skip{display:none}
.doc:not(.keep) img.ext{display:none}
.doc ::selection{background:#dcdeff}
.doc-scroll::-webkit-scrollbar{width:6px}
.doc-scroll::-webkit-scrollbar-thumb{border-radius:6px;background:rgba(116,128,158,.3)}

/* 快捷样式条 */
.styles-bar{flex:none;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:10px 12px;background:linear-gradient(180deg,#fff,#fafbfe);border-top:1px solid var(--line)}
.styles-bar::-webkit-scrollbar{display:none}
.sbtn{flex:none;height:38px;padding:0 16px;border:1px solid var(--line-3);background:linear-gradient(180deg,#fff,#fcfdff);
  border-radius:11px;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;
  box-shadow:0 1px 2px rgba(15,23,41,.04);
  transition:transform .15s var(--ease),border-color .15s,color .15s,background .15s}
.sbtn:active{transform:scale(.95);border-color:rgba(90,92,240,.55);color:var(--brand);
  background:linear-gradient(180deg,#f7f7ff,#f1f1ff)}

/* ───────── 图片页 ───────── */
.img-body{flex:1;min-height:0;min-width:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 6px;
  background:radial-gradient(520px 200px at 50% -80px,rgba(90,92,240,.07),transparent 72%),linear-gradient(180deg,#fbfcff,#f6f8fd)}
.img-item{display:flex;flex-direction:column;padding:11px;margin-bottom:10px;background:#fff;
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-1);animation:cardIn .4s var(--ease)}
@keyframes cardIn{from{transform:translateY(8px)}to{transform:none}}
.img-item .row1{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.img-item .row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.img-item .thumb{width:62px;height:62px;flex:none;border-radius:13px;object-fit:contain;background:#f5f7fc;
  border:1px solid var(--line-2);transition:opacity .35s var(--ease)}
.img-item .thumb.loading{opacity:0}
.img-item .thumb:active{transform:scale(.96)}
.img-item .m{flex:1;min-width:0}
.img-item .m b{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
.img-item .m small{font-size:11px;color:var(--muted-2)}
.img-item .acts{flex:0 0 100%;display:flex;gap:7px;margin-top:8px}
.mini{flex:1;height:40px;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line-3);background:linear-gradient(180deg,#fff,#fcfdff);border-radius:11px;color:var(--muted);
  font-size:12px;font-weight:600;transition:transform .15s var(--ease),border-color .15s,color .15s,background .15s}
.mini svg{width:16px;height:16px}
.mini.has-lb{gap:5px;font-size:12px;font-weight:600}
.mini:active{transform:scale(.96);border-color:rgba(90,92,240,.55);color:var(--brand);background:linear-gradient(180deg,#f7f7ff,#f1f1ff)}
.mini.ins{color:var(--brand);border-color:rgba(90,92,240,.42);background:linear-gradient(180deg,#f7f7ff,#f1f2ff)}
.cbtn{height:40px;padding:0 6px;border:1px solid var(--line-3);background:linear-gradient(180deg,#fff,#fcfdff);
  border-radius:11px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;
  transition:transform .15s var(--ease),border-color .15s,color .15s,background .15s}
.cbtn:active{transform:scale(.96);border-color:rgba(90,92,240,.55);color:var(--brand);background:linear-gradient(180deg,#f7f7ff,#f1f1ff)}
.cbtn.ghost{grid-column:1 / -1;color:var(--muted-2)}
.img-item.failed .thumb{opacity:.32;filter:grayscale(1)}
.img-item.failed .m b{color:var(--danger)}
.img-item.failed .m small:after{content:" · 加载失败，点图打开原图";color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:52px 22px;
  color:var(--muted-2);font-size:12.5px;line-height:1.9;text-align:center}
.empty svg{width:40px;height:40px;opacity:.4;animation:floaty 3.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.imgset{flex:none;padding:11px 14px;background:#fff;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.imgset .is-main{display:flex;align-items:center;gap:7px;white-space:nowrap}
.imgset input{width:62px;height:36px;border:1px solid var(--line-3);border-radius:10px;background:#fff;text-align:center;
  font-size:13px;font-weight:700;color:var(--ink)}
.imgset input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.imgset input::-webkit-outer-spin-button,.imgset input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.imgset .is-hint{color:var(--muted-2);font-size:11px}
.imgset .is-info{color:var(--gold-2);font-size:11px;margin-top:4px;min-height:0}
.switch{flex:none;display:flex;align-items:center;gap:11px;padding:14px;
  background:linear-gradient(180deg,#fff,#fbfcff);border-top:1px solid var(--line-2)}
.switch .sw-txt{flex:1;font-size:12.5px;color:var(--muted)}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{position:relative;flex:none;width:46px;height:27px;border-radius:999px;background:#dee3ef;
  box-shadow:inset 0 1px 2px rgba(15,23,41,.08);transition:background .24s var(--ease)}
.track:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(15,23,41,.32);transition:transform .26s var(--ease)}
.switch input:checked + .track{background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:inset 0 1px 2px rgba(15,23,41,.16),0 2px 8px rgba(90,92,240,.32)}
.switch input:checked + .track:after{transform:translateX(19px)}

/* ───────── 底部操作栏 ───────── */
.bottombar{position:relative;flex:none;min-width:0;display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr;gap:7px;
  padding:8px 10px calc(8px + var(--sab));background:linear-gradient(180deg,#fff,#fbfcff);
  border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(15,23,41,.4)}
.bbtn{height:52px;border-radius:14px;border:1px solid var(--line-3);background:linear-gradient(180deg,#fff,#fcfdff);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--text);box-shadow:0 1px 2px rgba(15,23,41,.04);
  transition:transform .15s var(--ease),border-color .15s,color .15s}
.bbtn svg{width:18px;height:18px}
.bbtn:active{transform:scale(.95)}
.bbtn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.bbtn.primary{border-color:transparent;color:#fff;
  background:linear-gradient(135deg,#6062f5,#7c5bf3 52%,#9a5ff0);
  box-shadow:0 8px 20px rgba(90,92,240,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.bbtn.primary:active{box-shadow:0 4px 12px rgba(90,92,240,.34),inset 0 1px 0 rgba(255,255,255,.3)}
.procbar{position:absolute;left:0;right:0;top:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .25s}
.procbar.on{opacity:1}
.procbar:after{content:"";position:absolute;left:-45%;top:0;height:100%;width:45%;
  background:linear-gradient(90deg,transparent,var(--brand),var(--brand-2),transparent);animation:procslide 1.05s linear infinite}
@keyframes procslide{to{left:105%}}

/* ───────── 抽屉（格式 / 更多） ───────── */
.sheet{position:fixed;inset:0;z-index:80;visibility:hidden;pointer-events:none}
.sheet.on{visibility:visible;pointer-events:auto}
.sheet-mask{position:absolute;inset:0;background:rgba(12,17,28,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .26s}
.sheet.on .sheet-mask{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
  padding:6px 16px calc(18px + var(--sab));transform:translateY(102%);transition:transform .3s var(--ease);
  box-shadow:0 -18px 50px rgba(15,23,41,.3)}
.sheet.on .sheet-panel{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 14px}
.sheet-h b{font-size:15px}
.sheet-h .done{height:36px;padding:0 16px;border-radius:11px;font-size:13px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 16px rgba(90,92,240,.3)}
.sheet-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-2)}
.sheet-row .k{flex:none;width:60px;font-size:13px;color:var(--muted)}
.sheet-row select{flex:1;appearance:none;-webkit-appearance:none;height:42px;padding:0 30px 0 12px;border:1px solid var(--line-3);
  border-radius:11px;background:#fff;font-size:13.5px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,#8b96ab 50%),linear-gradient(135deg,#8b96ab 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.sheet-row input{flex:1;height:42px;padding:0;border:1px solid var(--line-3);border-radius:11px;background:#fff;
  text-align:center;font-size:14px;font-weight:700}
.sheet-row select:focus,.sheet-row input:focus{outline:0;border-color:var(--brand);box-shadow:var(--ring)}
.sheet-row input::-webkit-outer-spin-button,.sheet-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sheet-row .u{flex:none;width:26px;font-size:11.5px;color:var(--muted-2)}
.nav-list{padding:2px 0 6px}
.nav-item{display:flex;align-items:center;gap:12px;height:54px;border-top:1px solid var(--line-2);
  font-size:14px;font-weight:600;color:var(--text);text-decoration:none}
.nav-item svg{width:19px;height:19px;color:var(--muted-2);flex:none}
.nav-item .sub{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--muted-2);max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:active{color:var(--brand)}
.nav-item:active svg{color:var(--brand)}

/* ───────── 提示 / 放大 ───────── */
.toast{position:fixed;left:50%;bottom:calc(88px + var(--sab));z-index:99;display:flex;align-items:center;gap:8px;
  padding:12px 18px;border-radius:14px;background:rgba(15,20,34,.95);color:#fff;font-size:13px;font-weight:500;
  border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(10px);box-shadow:0 18px 44px rgba(15,23,41,.4);
  opacity:0;pointer-events:none;max-width:86vw;text-align:left;
  transform:translate(-50%,18px) scale(.96);transition:transform .3s var(--ease),opacity .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.viewer{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(12,17,28,.76);backdrop-filter:blur(7px);opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s}
.viewer.on{opacity:1;visibility:visible}
.viewer img{max-width:94vw;max-height:82vh;border-radius:14px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.6);
  transform:scale(.96);transition:transform .3s var(--ease)}
.viewer.on img{transform:scale(1)}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">

<script src="https://cdn.jsdelivr.net/npm/docx@9.5.1/build/index.umd.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const doc=$('doc');
  let imgs=[], dragIdx=-1;

  /* ── 可选配置 ── */
  const FONTS=[
    {n:'仿宋_GB2312',css:"'仿宋_GB2312','FangSong','仿宋',serif"},
    {n:'仿宋',       css:"'仿宋','FangSong',serif"},
    {n:'楷体_GB2312',css:"'楷体_GB2312','KaiTi','楷体',serif"},
    {n:'楷体',       css:"'楷体','KaiTi',serif"},
    {n:'宋体',       css:"'宋体','SimSun',serif"},
    {n:'黑体',       css:"'黑体','SimHei',sans-serif"},
    {n:'微软雅黑',   css:"'微软雅黑','Microsoft YaHei',sans-serif"}
  ];
  const SIZES=[['初号',42],['小初',36],['一号',26],['小一',24],['二号',22],['小二',18],['三号',16],['小三',15],['四号',14],['小四',12],['五号',10.5]];
  FONTS.forEach((f,i)=>{const o=document.createElement('option');o.value=i;o.textContent=f.n;$('fFont').appendChild(o);});
  SIZES.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s[0]+'（'+s[1]+'pt）';$('fSize').appendChild(o);});
  $('fFont').value=0;   // 仿宋_GB2312
  $('fSize').value=6;   // 三号 16pt

  const curFont=()=>FONTS[+$('fFont').value]||FONTS[0];
  const curPt =()=>SIZES[+$('fSize').value]?SIZES[+$('fSize').value][1]:16;
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const isImgUrl=t=>{t=String(t||'').trim();
    return /^https?:\/\/\S+$/i.test(t)&&(/\.(png|jpe?g|gif|webp|bmp)(\?|#|$)/i.test(t)||/(mmbiz\.|qpic\.cn|qlogo\.cn)/i.test(t));};

  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400);}
  function popPill(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
  function stats(){const n=doc.innerText.replace(/\s+/g,'').length;const el=$('textStats');const v=n+' 字';if(el.textContent!==v){el.textContent=v;popPill(el);}}
  function proc(on){$('procbar').classList.toggle('on',!!on);}
  function paperIn(){doc.classList.remove('enter');void doc.offsetWidth;doc.classList.add('enter');}
  function waitImages(root){return Promise.all([...root.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r;}))).catch(()=>{});}
  function insertHTML(html){
    doc.focus();
    let ok=false;try{ok=document.execCommand('insertHTML',false,html);}catch(e){}
    if(ok)return;
    const sel=window.getSelection();
    const box=document.createElement('div');box.innerHTML=html;
    const frag=document.createDocumentFragment();while(box.firstChild)frag.appendChild(box.firstChild);
    if(sel&&sel.rangeCount&&doc.contains(sel.anchorNode)){const r=sel.getRangeAt(0);r.deleteContents();r.insertNode(frag);}
    else doc.appendChild(frag);
  }

  /* ── 排版设置 ── */
  function applySettings(){
    doc.style.setProperty('--bfont',curFont().css);
    doc.style.setProperty('--bsize',curPt()+'pt');
    doc.style.setProperty('--bline',(+$('fLine').value||28)+'pt');
    doc.style.setProperty('--bindent',(+$('fIndent').value||0));
  }

  /* ── 图片地址识别（尽可能把真实地址挖出来） ── */
  const normUrl=u=>{
    u=String(u||'').trim();
    if(!u)return '';
    if(/^\/\//.test(u))return 'https:'+u;
    return u;
  };
  const isPlaceholderData=u=>/^data:image\//i.test(u)&&u.length<600;   // 1×1 之类的内联占位图
  function realSrc(im){
    const cand=[];
    const add=v=>{if(v!=null){v=String(v).trim();if(v)cand.push(v);}};
    // 1) 常见懒加载属性
    ['data-src','data-original','data-actualsrc','data-lazy-src','data-lazyload','data-echo','data-url','data-image','data-origin','data-backsrc','data-src-large']
      .forEach(a=>add(im.getAttribute(a)));
    // 2) 任意 data-* 里看起来像网址的
    [...im.attributes].forEach(a=>{if(/^data-/i.test(a.name)&&/^(https?:)?\/\//i.test(a.value||''))add(a.value);});
    // 3) srcset / style 背景图
    const ss=im.getAttribute('srcset'); if(ss)add(ss.split(',')[0].trim().split(/\s+/)[0]);
    const st=im.getAttribute('style')||''; const m=st.match(/url\(["']?([^)"']+)/i); if(m)add(m[1]);
    // 4) src 本身
    add(im.getAttribute('src'));
    const pick=cand.find(u=>!isPlaceholderData(u))||cand[0]||'';
    return normUrl(pick);
  }

  /* ── 清理 / 归一化 ── */
  const ALLOWED_CLASS=new Set(['cen','rig','skip','usr','flush','ext']);
  function sanitize(html){
    const d=new DOMParser().parseFromString(html,'text/html');
    d.querySelectorAll('script,style,meta,link,iframe,object,embed,noscript').forEach(x=>x.remove());
    d.querySelectorAll('img').forEach(im=>{
      const s=realSrc(im);
      if(s)im.setAttribute('src',s); else im.removeAttribute('src');
      im.setAttribute('referrerpolicy','no-referrer');       // 去 Referer，绕过微信防盗链
      im.removeAttribute('loading');
      ['data-src','data-original','data-actualsrc','srcset','loading'].forEach(a=>im.removeAttribute(a));
    });
    // 只清洗"这一次粘贴进来的这一段"，绝不重排正文里已有的内容
    for(let i=0;i<3;i++){const w=document.createTreeWalker(d.body,NodeFilter.SHOW_ELEMENT);const a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(scrub);}
    [...d.body.querySelectorAll('div')].forEach(dv=>{
      if(!dv.querySelector('p,div,h1,h2,h3,h4,li,ul,ol,blockquote,img,table,figure') && dv.textContent.trim()){
        const q=d.createElement('p');q.innerHTML=dv.innerHTML;dv.replaceWith(q);
      }
    });
    // 只有一张图、没有文字 → 是你自己贴的图（始终显示）；否则算文章原图（默认只在小窗）
    const _ims=d.body.querySelectorAll('img'), _tx=d.body.textContent.trim();
    const userImg = _ims.length===1 && (!_tx || isImgUrl(_tx));
    d.body.querySelectorAll('img').forEach(im=>im.classList.add(userImg?'usr':'ext'));
    [...d.body.querySelectorAll('p,div')].forEach(e=>{if(!e.textContent.trim()&&!e.querySelector('img'))e.remove();});
    return d.body.innerHTML;
  }
  /* 图片过滤：最小尺寸由用户设定；只加 .skip 类（不真删），随时可调回来 */
  let minSide=90;
  try{const v=localStorage.getItem("gypec_minSide"); if(v!==null) minSide=Math.max(0,+v||0);}catch(e){}
  function applyFilter(){
    let skipped=0;
    [...doc.querySelectorAll("img")].forEach(im=>{
      const w=im.naturalWidth||0,h=im.naturalHeight||0;
      const skip = minSide>0 && w>0 && h>0 && Math.min(w,h)<=minSide && !im.classList.contains('usr');
      im.classList.toggle("skip",skip);
      if(skip)skipped++;
    });
    const info=$("filtInfo"); if(info) info.textContent = skipped? ("已过滤 "+skipped+" 张") : "";
    return skipped;
  }

  function scrub(el){
    const t=el.tagName;
    if(['SCRIPT','STYLE','NOSCRIPT','META','LINK','IFRAME','OBJECT','EMBED'].includes(t)){el.remove();return;}
    if(t==='FONT'||t==='SPAN'){
      const st=(el.getAttribute('style')||'').toLowerCase();
      if(/font-weight\s*:\s*(bold|[6-9]00)/.test(st)){const s=document.createElement('strong');while(el.firstChild)s.appendChild(el.firstChild);el.replaceWith(s);return;}
      if(/font-style\s*:\s*italic/.test(st)){const s=document.createElement('em');while(el.firstChild)s.appendChild(el.firstChild);el.replaceWith(s);return;}
      const f=document.createDocumentFragment();while(el.firstChild)f.appendChild(el.firstChild);el.replaceWith(f);return;
    }
    [...el.attributes].forEach(a=>{
      if(a.name==='class'){
        const keep=[...el.classList].filter(c=>ALLOWED_CLASS.has(c));
        if(keep.length)el.className=keep.join(' ');else el.removeAttribute('class');
      }else if(a.name==='style'){
        const st=a.value.toLowerCase();
        el.removeAttribute('style');
        if(/text-align\s*:\s*center/.test(st))el.classList.add('cen');
        else if(/text-align\s*:\s*right/.test(st))el.classList.add('rig');
      }else if(!['src','alt','href','referrerpolicy'].includes(a.name)){
        el.removeAttribute(a.name);
      }
    });
  }
  function clean(){
    for(let i=0;i<3;i++){const w=document.createTreeWalker(doc,NodeFilter.SHOW_ELEMENT);const a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(scrub);}
    // 再来一次地址补救（属性被清洗后可能还有漏网）
    [...doc.querySelectorAll('img')].forEach(im=>{
      const s=realSrc(im);
      if(s)im.setAttribute('src',s);
      if(!(im.getAttribute('src')||'')){im.remove();}
    });
    // 游离 div → p
    [...doc.querySelectorAll('div')].forEach(d=>{
      if(!d.querySelector('p,div,h1,h2,h3,h4,li,ul,ol,blockquote,img,table,figure') && d.textContent.trim()){
        const p=document.createElement('p');p.innerHTML=d.innerHTML;d.replaceWith(p);
      }
    });
    // 合并空格
    const w2=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT);const ns=[];while(w2.nextNode())ns.push(w2.currentNode);
    ns.forEach(n=>{n.nodeValue=n.nodeValue.replace(/[ \t\u00a0]{2,}/g,' ').replace(/\n{2,}/g,'\n');});
    // 去空段
    [...doc.querySelectorAll('p,div')].forEach(e=>{if(!e.textContent.trim()&&!e.querySelector('img'))e.remove();});
    stats();
  }

  /* ── 微信图片防盗链修复（不依赖任何第三方代理） ── */
  const RETRYRE=/[?&]_r=1/;
  async function healWxImages(){
    let changed=false;
    [...doc.querySelectorAll('img')].forEach(im=>{
      const src=im.getAttribute('src')||'';
      im.setAttribute('referrerpolicy','no-referrer');
      const bad = im.complete && (im.naturalWidth===0 || (im.naturalWidth===140&&im.naturalHeight===140));
      if(bad && !RETRYRE.test(src) && /^https?:/i.test(src)){
        im.setAttribute('src', src+(src.indexOf('?')>=0?'&':'?')+'_r=1');
        changed=true;
      }
    });
    return changed;
  }
  async function settle(){
    proc(true);
    await waitImages(doc);
    const changed=await healWxImages();
    if(changed)await waitImages(doc);
    applyFilter();
    extract();
    proc(false);
  }

  /* ── 裁剪引擎 ── */
  const SB_HTML='<!doctype html><meta charset="utf-8"><script>'
    +"window.addEventListener('message',async(e)=>{const d=e.data||{};if(d.t!=='crop'&&d.t!=='raw')return;"
    +"try{const im=new Image();im.crossOrigin='anonymous';"
    +"await new Promise((res,rej)=>{im.onload=res;im.onerror=()=>rej(new Error('load'));im.src=d.url;});"
    +"const W=d.w||im.naturalWidth,H=d.h||im.naturalHeight;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');"
    +"x.fillStyle='#fff';x.fillRect(0,0,W,H);try{x.imageSmoothingQuality='high';}catch(e){}"
    +"x.drawImage(im,0,0,W,H);"
    +"const _m=d.mime||'image/png';const _o=d.t==='raw'?c.toDataURL(_m,_m==='image/jpeg'?0.93:undefined):c.toDataURL('image/jpeg',0.93);parent.postMessage({t:d.t,id:d.id,ok:true,data:_o},'*');}"
    +"catch(err){parent.postMessage({t:d.t,id:d.id,ok:false,err:String((err&&err.name)||err)},'*');}});"
    +'<\/script>';
  function drawCrop(im,tw,th){
    const sw=im.naturalWidth,sh=im.naturalHeight;if(!sw||!sh)throw new Error('no size');
    const c=document.createElement('canvas');c.width=tw;c.height=th;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,tw,th);
    try{x.imageSmoothingQuality='high';}catch(e){}
    x.drawImage(im,0,0,sw,sh,0,0,tw,th);   // 整张图缩放到目标尺寸（不裁剪）
    return c.toDataURL('image/jpeg',0.93);
  }
  function loadImg(im){
    return new Promise(r=>{
      if(im.complete&&im.naturalWidth){r();return;}
      const done=()=>r();
      im.addEventListener('load',done,{once:true});
      im.addEventListener('error',done,{once:true});
      setTimeout(done,1800);
    });
  }
  function cropDirect(src,tw,th){
    return new Promise((res,rej)=>{
      const im=new Image();im.crossOrigin='anonymous';
      im.onload=()=>{try{res(drawCrop(im,tw,th));}catch(e){rej(e);}};
      im.onerror=()=>rej(new Error('load'));
      im.src=src;
    });
  }
  let sbWin=null,sbReady=null,sbSeq=0;
  function ensureSandbox(){
    if(sbReady)return sbReady;
    sbReady=new Promise((res,rej)=>{
      const f=document.createElement('iframe');
      f.setAttribute('sandbox','allow-scripts');       // 不给 allow-same-origin → 不透明源(Origin: null)，微信才放行
      f.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;border:0;opacity:0';
      f.srcdoc=SB_HTML;
      f.onload=()=>{sbWin=f.contentWindow;res();};
      document.body.appendChild(f);
      setTimeout(()=>{if(!sbWin)rej(new Error('sandbox timeout'));},6000);
    });
    return sbReady;
  }
  function cropViaSandbox(src,tw,th){
    return ensureSandbox().then(()=>new Promise((res,rej)=>{
      const id=++sbSeq;
      const onMsg=e=>{const d=e.data;if(!d||d.t!=='crop'||d.id!==id)return;
        window.removeEventListener('message',onMsg);d.ok?res(d.data):rej(new Error(d.err||'fail'));};
      window.addEventListener('message',onMsg);
      try{sbWin.postMessage({t:'crop',id:id,url:src,w:tw,h:th},'*');}catch(e){rej(e);}
      setTimeout(()=>{window.removeEventListener('message',onMsg);rej(new Error('timeout'));},15000);
    }));
  }
  function rawViaSandbox(src,mime){
    return ensureSandbox().then(()=>new Promise((res,rej)=>{
      const id=++sbSeq;
      const onMsg=e=>{const d=e.data;if(!d||d.t!=='raw'||d.id!==id)return;
        window.removeEventListener('message',onMsg);d.ok?res(d.data):rej(new Error(d.err||'fail'));};
      window.addEventListener('message',onMsg);
      try{sbWin.postMessage({t:'raw',id:id,url:src,mime:mime||'image/png'},'*');}catch(e){rej(e);}
      setTimeout(()=>{window.removeEventListener('message',onMsg);rej(new Error('timeout'));},20000);
    }));
  }
  async function cropImg(i,tw,th){
    const x=imgs[i];if(!x)return;
    const from=x.el._orig||x.el.src||x.src;
    proc(true);toast('正在调整尺寸…');
    let data=null;
    try{data=await cropDirect(from,tw,th);}catch(e){}
    if(!data){try{data=await cropViaSandbox(from,tw,th);}catch(e){}}
    proc(false);
    if(!data){toast('调整失败：可先「下载」该图，在本地处理好再贴进来');return;}
    if(!x.el._orig)x.el._orig=from;
    x.el.src=data;
    await loadImg(x.el);
    extract();
    toast('图片已设为 '+tw+'×'+th+'（可复制 / 下载 / 拖入正文）✅');
  }
  function restoreImg(i){
    const x=imgs[i];if(!x||!x.el._orig)return;
    x.el.src=x.el._orig;x.el._orig=null;
    loadImg(x.el).then(()=>{extract();toast('已还原为原图');});
  }

  /* ── 小窗：提取图片 ── */
  const IC_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2.4"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  const IC_DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  const EMPTY='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l4.5-4.5a2 2 0 0 1 2.8 0L16 17.5"/><path d="M14.6 14.9l1.5-1.5a2 2 0 0 1 2.8 0L21 15.5"/></svg>粘贴正文后，较大的图片会自动提取到这里<br>点「复制」后到正文长按粘贴，或点「插入正文」直接放进来</div>';
  function extract(){
    const seen=new Set();
    imgs=[...doc.querySelectorAll('img')].filter(im=>{
      if(im.classList.contains('skip'))return false;
      const u=im.src||''; if(!u||seen.has(u))return false;   // 按地址去重：拖进正文的同一张不会重复出现
      seen.add(u); return true;
    }).map(im=>({el:im,src:im.src,w:im.naturalWidth||im.width||0,h:im.naturalHeight||im.height||0}));
    renderImgs();
  }
  function renderImgs(){
    const box=$('imgList');
    const el=$('imgStats');const v=imgs.length+' 张';if(el.textContent!==v){el.textContent=v;popPill(el);}
    if(!imgs.length){box.innerHTML=EMPTY;return;}
    box.innerHTML='';
    imgs.forEach((x,i)=>{
      const d=document.createElement('div');d.className='img-item';d.style.animationDelay=(i*45)+'ms';
      const cut=!!x.el._orig;
      d.innerHTML='<div class="row1">'
        +'<img class="thumb" src="'+x.src+'" data-i="'+i+'" alt="" referrerpolicy="no-referrer">'
        +'<div class="m"><b>图片 '+(i+1)+'</b><small>'+(x.w||'?')+' × '+(x.h||'?')+' px</small></div>'
        +'<div class="acts">'
        +'<button class="mini" data-a="copy" data-i="'+i+'" title="复制图片">'+IC_COPY+'</button>'
        +'<button class="mini" data-a="dl" data-i="'+i+'" title="下载图片">'+IC_DL+'</button>'
        +'</div></div>'
        +'<div class="row2">'
        +'<button class="cbtn" data-a="crop" data-i="'+i+'" data-w="800" data-h="600" title="把图片尺寸设为 800×600">设为 800×600</button>'
        +'<button class="cbtn" data-a="crop" data-i="'+i+'" data-w="650" data-h="433" title="把图片尺寸设为 650×433">设为 650×433</button>'
        +(cut?'<button class="cbtn ghost" data-a="restore" data-i="'+i+'" title="还原为原图">还原</button>':'')
        +'</div>';
      box.appendChild(d);
    });
    // 缩略图淡入保险：只有确实没加载完才临时透明，且有超时兜底，绝不长期不可见
    box.querySelectorAll('img.thumb').forEach(im=>{
      const done=()=>im.classList.remove('loading');
      if(!im.complete) im.classList.add('loading');
      im.addEventListener('load',done); im.addEventListener('error',done);
      setTimeout(done,1600);
      // 可拖到左边正文
      im.setAttribute('draggable','true');
      im.addEventListener('dragstart',ev=>{
        dragIdx=+im.dataset.i;
        try{
          ev.dataTransfer.effectAllowed='copy';
          ev.dataTransfer.setData('text/html','<img src="'+im.src+'" referrerpolicy="no-referrer">');
          ev.dataTransfer.setData('text/uri-list',im.src);
          ev.dataTransfer.setData('text/plain',im.src);
        }catch(e){}
      });
      im.addEventListener('dragend',()=>{dragIdx=-1;});
    });
  }
  async function toPngBlob(url){
    const blob=await (await fetch(url,{referrerPolicy:'no-referrer'})).blob();
    if(blob.type==='image/png')return blob;
    const bmp=await createImageBitmap(blob);
    const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0);
    return await new Promise(r=>c.toBlob(r,'image/png'));
  }
  async function copyImgFallback(i){
    const x=imgs[i];if(!x)return;
    try{                                   // ① 先试图片字节
      const blob=await toPngBlob(x.src);
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      toast('图片已复制 ✅');return;
    }catch(e){}
    try{                                   // ② 再试复制成 HTML 图片（粘贴时一样能进正文）
      const h='<img src="'+x.src+'" referrerpolicy="no-referrer">';
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'})})]);
      toast('已复制，切到正文位置粘贴即可 ✅');return;
    }catch(e){}
    toast('系统剪贴板不可用，已改用「插入正文」或「下载」');
  }
  function copyImg(i){
    const x=imgs[i];if(!x)return;
    const box=document.createElement('div');
    box.setAttribute('contenteditable','true');
    box.style.cssText='position:fixed;left:-9999px;top:0;width:2px;height:2px;overflow:hidden;opacity:0';
    const im=document.createElement('img');im.setAttribute('referrerpolicy','no-referrer');im.src=x.src;
    box.appendChild(im);document.body.appendChild(box);
    let done=false;
    const finish=()=>{
      if(done)return;done=true;
      const r=document.createRange();r.selectNodeContents(box);
      const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
      let ok=false;try{ok=document.execCommand('copy');}catch(e){}
      sel.removeAllRanges();box.remove();
      if(ok)toast('图片已复制 ✅ 到正文长按粘贴');
      else copyImgFallback(i);
    };
    if(im.complete)setTimeout(finish,30);
    else{im.addEventListener('load',finish);im.addEventListener('error',finish);setTimeout(finish,1500);}
  }
  async function dlImg(i){
    const x=imgs[i];if(!x)return;
    try{
      const blob=await (await fetch(x.src,{referrerPolicy:'no-referrer'})).blob();
      const ext=/jpe?g/i.test(blob.type||'')?'jpg':'png';
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='图片'+(i+1)+'.'+ext;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      toast('已下载 图片'+(i+1)+' ✅');

  }

  /* ── 把图片放到正文的指定位置（拖拽用） ── */
  function insertImgAt(cx,cy,src){
    const im=document.createElement('img');
    im.className='usr';im.setAttribute('referrerpolicy','no-referrer');im.src=src;
    const p=document.createElement('p');p.appendChild(im);
    let ref=null;
    try{
      let r=null;
      if(document.caretRangeFromPoint)r=document.caretRangeFromPoint(cx,cy);
      else if(document.caretPositionFromPoint){const cp=document.caretPositionFromPoint(cx,cy);if(cp){r=document.createRange();r.setStart(cp.offsetNode,cp.offset);}}
      if(r&&doc.contains(r.startContainer)){
        let n=r.startContainer;
        while(n&&n!==doc&&!/^(P|H1|H2|H3|H4|LI|BLOCKQUOTE|DIV)$/.test(n.tagName))n=n.parentNode;
        if(n&&n!==doc)ref=n;
      }
    }catch(e){}
    if(ref&&ref.parentNode)ref.parentNode.insertBefore(p,ref.nextSibling);
    else doc.appendChild(p);
    stats();extract();
    toast('图片已放入正文，可再拖动位置或点「居中」✅');
  }

  /* ── 一键复制（把当前格式"写死"到内容里，粘到哪都不丢） ── */
  function inlineClone(){
    const c=doc.cloneNode(true);
    const font=curFont().n, fs=curPt(), line=+$('fLine').value||28, ind=+$('fIndent').value||0;
    const base='font-family:'+font+';font-size:'+fs+'pt;line-height:'+line+'pt;mso-line-height-rule:exactly;color:#000;';
    const par=base+'margin:0;'+(ind>0?('text-indent:'+(ind*fs)+'pt;mso-char-indent-count:'+ind+';'):'text-indent:0;');
    c.querySelectorAll('h1').forEach(e=>{e.style.cssText=base+'font-size:'+(fs+6)+'pt;font-weight:bold;text-align:center;text-indent:0;margin:0 0 20pt;';});
    c.querySelectorAll('h2').forEach(e=>{e.style.cssText=base+'font-size:'+(fs+2)+'pt;font-weight:bold;text-indent:0;margin:18pt 0 10pt;';});
    c.querySelectorAll('h3,h4').forEach(e=>{e.style.cssText=base+'font-weight:bold;text-indent:0;margin:14pt 0 8pt;';});
    c.querySelectorAll('p,li').forEach(e=>{e.style.cssText=par;});
    c.querySelectorAll('blockquote').forEach(e=>{e.style.cssText=par+'border-left:3pt solid #d9dde5;padding-left:10pt;color:#555;';});
    c.querySelectorAll('div,section').forEach(e=>{
      if(e.querySelector('p,div,section,h1,h2,h3,h4,li,ul,ol,blockquote,img,figure,table'))return;
      if(e.textContent.trim())e.style.cssText=par;
    });
    c.querySelectorAll('.cen').forEach(e=>{e.style.textAlign='center';e.style.textIndent='0';});
    c.querySelectorAll('.rig').forEach(e=>{e.style.textAlign='right';e.style.textIndent='0';});
    c.querySelectorAll('img').forEach(e=>{e.style.cssText='max-width:100%;height:auto;display:block;margin:12pt auto;';});
    // 只复制"看得见的内容"：被过滤的小图、以及未打开开关时的文章原图，都不带走
    c.querySelectorAll('img.skip').forEach(e=>e.remove());
    if(!$('keepInDoc').checked)c.querySelectorAll('img.ext').forEach(e=>e.remove());
    c.querySelectorAll('p,div,section').forEach(e=>{if(!e.textContent.trim()&&!e.querySelector('img'))e.remove();});
    return c;
  }
  function copyRich(){
    if(!doc.innerText.trim()&&!doc.querySelector('img')){toast('还没有内容');return;}
    const box=document.createElement('div');
    box.setAttribute('contenteditable','true');
    box.style.cssText='position:fixed;left:-9999px;top:0;width:760px;opacity:0;pointer-events:none';
    box.appendChild(inlineClone());
    document.body.appendChild(box);
    const r=document.createRange();r.selectNodeContents(box);
    const s=window.getSelection();s.removeAllRanges();s.addRange(r);
    let ok=false;try{ok=document.execCommand('copy');}catch(e){}
    s.removeAllRanges();box.remove();
    toast(ok?'已复制（含字体/字号/行距/首行缩进等全部格式）✅':'复制失败，请手动全选复制');
  }

  /* ── 一键排版 ── */
  function formatDoc(){clean();applySettings();paperIn();settle();toast('排版完成 ✨');}

  /* ── 快捷样式 ── */
  function applyStyle(k){
    const sel=window.getSelection();
    if(!sel||sel.rangeCount===0||!doc.contains(sel.anchorNode)){toast('请先在大窗里选中文字');return;}
    doc.focus();
    if(k==='bold'){document.execCommand('bold');}
    else if(k==='cen'||k==='rig'||k==='flush'){
      let n=sel.anchorNode;while(n&&n.nodeType!==1)n=n.parentNode;
      while(n&&n!==doc && !/^(P|H1|H2|H3|H4|LI|BLOCKQUOTE|DIV)$/.test(n.tagName))n=n.parentNode;
      if(n&&n!==doc){
        if(k==='flush'){n.classList.toggle('flush');}
        else{n.classList.toggle(k);n.classList.remove(k==='cen'?'rig':'cen');}
      }
    }
    else{document.execCommand('formatBlock',false,k);}
    stats();
  }

  /* ── 导出 Word ── */
  const BLOCK=new Set(['DIV','SECTION','ARTICLE','P','LI','UL','OL','BLOCKQUOTE','FIGURE','TABLE','H1','H2','H3','H4']);
  function blockList(root){
    const out=[];
    (function walk(node){
      [...node.children].forEach(el=>{
        const tag=el.tagName;
        if(tag==='IMG'){if(!el.classList.contains('skip'))out.push({img:el});return;}
        if([...el.children].some(c=>BLOCK.has(c.tagName)||c.tagName==='IMG')){walk(el);return;}
        if(el.textContent.trim()||el.querySelector('img'))out.push({el});

  function runsOf(el){

  }
  function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);}
  async function exportWord(){
    if(!doc.innerText.trim()){toast('请先粘贴内容');return;}
    clean();applySettings();await settle();
    const font=curFont().n, pt=curPt(), line=+$('fLine').value||28, ind=+$('fIndent').value||0;
    const keep=$('keepInDoc').checked;
    const items=blockList(doc);
    const alignOf=el=>el.classList.contains('cen')?'center':el.classList.contains('rig')?'right':'left';

      try{
        const {Document,Packer,Paragraph,TextRun,ImageRun,AlignmentType}=docx;

              const res=await fetch(it.img.src,{referrerPolicy:'no-referrer'});const buf=await res.arrayBuffer();

              const w=480,h=Math.max(60,Math.round(480*((nh/nw)||.6)));

            indent: (al==='left'&&ind>0)?{firstLine:Math.round(ind*pt*20)}:undefined,
            spacing: {line:Math.round(line*20),lineRule:'exact'},

        download(blob,'排版结果.docx');toast('已导出 Word（.docx）✅');
      }catch(e){toast('导出失败：'+e.message);}
      return;
    }
    let body='';
    for(const it of items){
      if(it.img){
        if(keep)body+='<p class="cen"><img src="'+it.img.src+'" style="max-width:420pt"></p>';
        continue;
      }
      const el=it.el, al=alignOf(el), head=/^H[1-3]$/.test(el.tagName);
      const sz=head?(pt+6):pt;
      const st="font-family:'"+font+"';font-size:"+sz+'pt;line-height:'+line+'pt;mso-line-height-rule:exactly;margin:0;'
        +(al==='center'?'text-align:center;text-indent:0;':al==='right'?'text-align:right;text-indent:0;':(ind>0?'text-indent:'+(ind*sz)+'pt;mso-char-indent-count:'+ind+';':''));
      const inner=runsOf(el).map(r=>'<span style="'+(r.bold||head?'font-weight:bold;':'')+'">'+esc(r.text)+'</span>').join('');
      body+='<p style="'+st+'">'+(inner||'&nbsp;')+'</p>';
    }
    const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
      +'<head><meta charset="utf-8"><title>排版结果</title>'
      +'<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'
      +'<style>@page{size:A4;margin:37mm 26mm 35mm 28mm}body{margin:0}p{margin:0}</style></head><body>'+body+'</body></html>';
    download(new Blob(['\ufeff'+html],{type:'application/msword'}),'排版结果.doc');
    toast('已导出 Word（.doc）✅');
  }

  /* ── 粘贴 ── */
  doc.addEventListener('paste',async e=>{
    const cd=e.clipboardData;if(!cd)return;
    const html=cd.getData('text/html'),text=cd.getData('text/plain');
    const files=[...(cd.items||[])].filter(x=>x.kind==='file'&&x.type.startsWith('image/'));
    e.preventDefault();
    const htmlHasImg=/<img[\s>]/i.test(html||'');
    let imgPasted=false;
    if(files.length && !htmlHasImg){
      // 直接粘贴图片（例如从小窗「复制」过来的图）→ 只插入这一张到自己想要的位置
      imgPasted=true;
      for(const it of files){
        const f=it.getAsFile();if(!f)continue;
        const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
        insertHTML('<img class="usr" src="'+url+'" alt=""><p><br></p>');
      }
    }else if(!htmlHasImg&&isImgUrl(text)){
      imgPasted=true;
      insertHTML('<img class="usr" src="'+text.trim()+'" referrerpolicy="no-referrer" alt=""><p><br></p>');
    }else if(html){
      insertHTML(sanitize(html));
    }else if(text){
      insertHTML(esc(text).replace(/\n/g,'<br>'));
    }
    setTimeout(()=>{
      applySettings();stats();
      if(!imgPasted)paperIn();
      const n=doc.querySelectorAll('img:not(.usr)').length;
      extract();
      const chars=doc.innerText.replace(/\s+/g,'').length;
      if(imgPasted){settle();toast('图片已放入正文 ✅ 可再长按选中调整');}
      else if(n){settle();toast('已识别 '+chars+' 字 · 图片 '+n+' 张（已进小窗，切到「图片」页可复制 / 插入正文）');}
      else{
        const hasPh=/^\s*图片\s*$/m.test(text||'');
        toast(hasPh?'正文已识别，但剪贴板里没带图片数据（正文里的「图片」只是占位文字）——请在浏览器打开文章后重新复制':'正文已识别，未检测到图片');
      }
    },130);
  });
  doc.addEventListener('input',()=>{stats();});
  doc.addEventListener('dragover',e=>{e.preventDefault();try{e.dataTransfer.dropEffect='copy';}catch(err){}});
  doc.addEventListener('drop',e=>{
    e.preventDefault();
    const dt=e.dataTransfer;if(!dt)return;
    let src='';
    try{src=(dt.getData('text/uri-list')||'').split(/\r?\n/)[0]||'';}catch(err){}
    if(!src){try{const h=dt.getData('text/html')||'';const m=h.match(/<img[^>]+src=["']([^"']+)["']/i);if(m)src=m[1];}catch(err){}}
    if(!src&&dragIdx>=0&&imgs[dragIdx])src=imgs[dragIdx].src;
    if(!src){toast('没识别到图片，请从小窗拖过来');return;}
    insertImgAt(e.clientX,e.clientY,src);
  });

  /* ── 初始化 ── */
  try{document.execCommand('defaultParagraphSeparator',false,'p');}catch(e){}
  $('viewerImg').referrerPolicy='no-referrer';
  document.querySelectorAll('.sbtn').forEach(function(b){b.addEventListener('mousedown',function(e){e.preventDefault();});b.addEventListener('click',function(e){e.preventDefault();if(window.__mStyle){window.__mStyle(b.dataset.style);return;}if(window.__mRestore)window.__mRestore();applyStyle(b.dataset.style);});});
  ['fFont','fSize','fLine','fIndent'].forEach(id=>{$(id).addEventListener('input',applySettings);$(id).addEventListener('change',applySettings);});
  $('formatBtn').onclick=formatDoc;
  $('copyBtn').onclick=copyRich;
  $('wordBtn').onclick=exportWord;
  $('clearBtn').onclick=()=>{doc.innerHTML='';imgs=[];renderImgs();stats();toast('已清空');};
  const msEl=$('minSide');
  if(msEl){
    msEl.value=minSide;
    const onMs=()=>{minSide=Math.max(0,+msEl.value||0);try{localStorage.setItem('gypec_minSide',minSide);}catch(e){}applyFilter();extract();};
    msEl.addEventListener('input',onMs); msEl.addEventListener('change',onMs);
  }
  const syncKeep=()=>doc.classList.toggle('keep',$('keepInDoc').checked);
  $('keepInDoc').addEventListener('change',syncKeep);
  syncKeep();
  $('imgList').addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'){const it=t.closest('.img-item');if(it)it.classList.add('failed');}},true);
  $('imgList').addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');
    if(b){const i=+b.dataset.i,a=b.dataset.a;
      if(a==='copy')copyImg(i);
      else if(a==='dl')dlImg(i);
      else if(a==='crop')cropImg(i,+b.dataset.w,+b.dataset.h);
      else if(a==='restore')restoreImg(i);
      return;}
    const im=e.target.closest('img[data-i]');
    if(im){
      const it=im.closest('.img-item'),i=+im.dataset.i;
      if(it&&it.classList.contains('failed')){window.open(imgs[i]?imgs[i].src:im.src,'_blank','noopener,noreferrer');return;}
      $('viewerImg').src=im.src;$('viewer').classList.add('on');
    }
  });
  $('viewer').onclick=()=>$('viewer').classList.remove('on');
  document.addEventListener('keydown',e=>{if(e.key==='Escape')$('viewer').classList.remove('on');if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();formatDoc();}});
  // 段首按退格 → 取消该段首行缩进（再按一次才合并段落）
  doc.addEventListener('keydown',e=>{
    if(e.key!=='Backspace')return;
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount||!sel.isCollapsed)return;
    const r=sel.getRangeAt(0);
    if(r.startOffset!==0)return;
    let n=r.startContainer;if(n.nodeType===3)n=n.parentNode;
    while(n&&n!==doc&&!/^(P|H1|H2|H3|H4|LI|BLOCKQUOTE|DIV)$/.test(n.tagName))n=n.parentNode;
    if(!n||n===doc)return;
    if(n.classList.contains('flush')||n.classList.contains('cen')||n.classList.contains('rig'))return;
    if(parseFloat(getComputedStyle(n).textIndent)>0){e.preventDefault();n.classList.add('flush');toast('已取消该段首行缩进');}
  });

  window.__m={extract:extract,stats:stats,imgs:function(){return imgs;},toast:toast,raw:rawViaSandbox};
  applySettings();stats();renderImgs();
})();
</script>
<script>/* 手机版增强：分页切换 / 复制 / 下载 / 插入正文 / 抽屉 / 选区保护 */
(function(){

  /* ───────── 选区记忆（手机点按钮会把选区清掉，必须自己记住） ───────── */
  function remember(){

  document.addEventListener('selectionchange',remember);
  doc.addEventListener('keyup',remember);
  doc.addEventListener('mouseup',remember);
  doc.addEventListener('blur',function(){setTimeout(remember,0);});
  // 手指点在正文里 → 若是"放下光标"（折叠），就清掉旧的选区记忆，避免误套用到上一次选的段落
  doc.addEventListener('touchend',function(){
    setTimeout(function(){

  function insertAt(src){

  /* ───────── 手机端排版样式（不依赖 execCommand，自己做 DOM） ───────── */
  var BLOCK_SEL='p,h1,h2,h3,h4,li,blockquote';
  var TIP={h1:'已设为标题',p:'已设为正文',bold:'已切换加粗',cen:'已居中',rig:'已右对齐',flush:'已取消首行缩进'};

  function isWholeBold(b){

  }
  function tagAs(b,tag){
    if(!b||b.tagName.toLowerCase()===tag)return;
    var el=document.createElement(tag);
    ['cen','rig','flush'].forEach(function(c){if(b.classList.contains(c))el.classList.add(c);});
    while(b.firstChild)el.appendChild(b.firstChild);
    if(b.parentNode)b.parentNode.replaceChild(el,b);
  }
  function applyOne(b,k){
    if(!b)return;
    if(k==='cen'||k==='rig'){
      var on=!b.classList.contains(k);
      b.classList.remove('cen');b.classList.remove('rig');
      if(on){b.classList.add(k);b.classList.remove('flush');}
    }else if(k==='flush'){
      b.classList.toggle('flush');
    }else if(k==='bold'){
      var wasBold=isWholeBold(b);
      unwrapBold(b);
      if(!wasBold){
        var st=document.createElement('strong');
        while(b.firstChild)st.appendChild(b.firstChild);
        b.appendChild(st);
      }
    }else if(k==='h1'||k==='p'){
      tagAs(b,k==='h1'?'h1':'p');
    }
  }
  function applyStyleMobile(k){
    var range=pickRange();
    if(!range){toast('请先在正文里长按选中要改的文字');return;}
    var blocks=blocksOf(range).filter(function(b){return b&&doc.contains(b);});
    if(!blocks.length){sRange=null;cRange=null;toast('请先在正文里长按选中要改的文字');return;}
    for(var i=0;i<blocks.length;i++)applyOne(blocks[i],k);
    try{var s=window.getSelection();s.removeAllRanges();s.addRange(range);}catch(e){}
    var vd=$('viewDoc');
    if(vd&&!vd.classList.contains('on'))switchTab('doc');
    if(M.stats)M.stats();
    if(M.extract)M.extract();
    toast((TIP[k]||'已应用')+'（'+(blocks.length>1?(blocks.length+' 段'):'本段')+'）');
  }
  window.__mStyle=applyStyleMobile;

  /* ───────── 图片字节获取（用沙箱，绕开跨域） ───────── */
  function dataUrlToBlob(du){
    var i=du.indexOf(',');
    var head=du.slice(0,i), body=du.slice(i+1);
    var mime=(head.match(/:(.*?);/)||[])[1]||'image/png';
    var isB64=/;base64/i.test(head);
    var bin=isB64?atob(body):decodeURIComponent(body);
    var u8=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);
    return new Blob([u8],{type:mime});
  }
  async function canvasPng(blob){
    try{
      var bmp=await createImageBitmap(blob);
      var c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
      c.getContext('2d').drawImage(bmp,0,0);
      return await new Promise(function(r){c.toBlob(r,'image/png');});
    }catch(e){ return blob; }
  }
  async function blobOf(src,mime){
    mime=mime||'image/png';
    if(/^data:/i.test(src)){
      var b=await (await fetch(src)).blob();
      if(b.type===mime)return b;
      if(mime==='image/png')return await canvasPng(b);
      return b;
    }
    if(M.raw){
      var du=await M.raw(src,mime);      // 沙箱：Origin 为 null，微信图片放行
      return dataUrlToBlob(du);
    }
    var r=await fetch(src,{referrerPolicy:'no-referrer'});
    return await r.blob();
  }

  /* ───────── 复制图片（必须在点击手势内同步调用 clipboard.write） ───────── */
  function copyImg(i){
    var x=imgsOf()[i];
    if(!x){ toast('没找到这张图，请重试'); return; }
    var src=x.src;
    var html='<img src="'+src+'" referrerpolicy="no-referrer" alt="">';
    var canWrite=!!(navigator.clipboard&&window.ClipboardItem)&&window.isSecureContext;
    if(canWrite){
      try{
        // 值传 Promise：write() 本身仍是同步的，才不丢"用户手势"
        var item=new ClipboardItem({
          'text/html':new Blob([html],{type:'text/html'}),
          'text/plain':src,
          'image/png':blobOf(src,'image/png')
        });
        navigator.clipboard.write([item]).then(function(){
          toast('图片已复制 ✅ 到正文长按粘贴即可');
        }).catch(function(){
          insertFallback(i,src,'系统剪贴板拒绝写入');
        });
        return;
      }catch(e){}
    }
    insertFallback(i,src,'此浏览器不支持复制图片');
  }
  function insertFallback(i,src,why){
    if(insertAt(src)){
      switchTab('doc');
      toast(why+'，已直接插入正文 ✅');
    }else{
      toast(why+'，请改用「下载」');
    }
  }

  /* ───────── 下载图片 ───────── */
  async function dlImg(i){
    var x=imgsOf()[i];
    if(!x){ toast('没找到这张图，请重试'); return; }
    var src=x.src;
    var ext=/^data:image\/jpe?g/i.test(src)?'jpg':'png';
    try{
      var blob=await blobOf(src,'image/png');
      if(/jpe?g/i.test(blob.type||''))ext='jpg';
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download='图片'+(i+1)+'.'+ext;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},6000);
      toast('已下载 图片'+(i+1)+' ✅');
    }catch(e){
      try{ window.open(src,'_blank','noopener,noreferrer'); toast('已在新标签打开，长按图片可保存到相册'); }
      catch(e2){ toast('下载失败：请长按缩略图，用系统菜单保存'); }
    }
  }

  /* ───────── 小窗按钮：注入文字标签 + 「插入正文」 ───────── */
  function inject(){
    if(!list)return;
    var items=list.querySelectorAll('.img-item');
    for(var i=0;i<items.length;i++){
      var it=items[i],acts=it.querySelector('.acts'),th=it.querySelector('img.thumb');
      if(!acts||!th)continue;
      var ms=acts.querySelectorAll('.mini');
      for(var k=0;k<ms.length;k++){
        var a=ms[k].getAttribute('data-a');
        if(LBL[a]&&!ms[k].querySelector('.lb')){
          var sp=document.createElement('span');
          sp.className='lb';sp.textContent=LBL[a];
          ms[k].appendChild(sp);ms[k].classList.add('has-lb');
        }
      }
      if(acts.querySelector('.ins'))continue;
      var b=document.createElement('button');
      b.type='button';b.className='mini ins';b.textContent='插入正文';
      b.setAttribute('data-a','ins');b.setAttribute('data-i',th.getAttribute('data-i'));
      acts.insertBefore(b,acts.firstChild);
    }
  }

  /* ───────── 统一的点击处理（捕获阶段拦下，避免和电脑版逻辑重复执行） ───────── */
  document.addEventListener('click',function(e){
    var t=e.target;
    var b=(t&&t.closest)?t.closest('[data-a]'):null;
    if(!b||!list||!list.contains(b))return;
    var a=b.getAttribute('data-a');
    if(a!=='copy'&&a!=='dl'&&a!=='ins')return;          // 裁剪/还原交给电脑版逻辑
    e.preventDefault();e.stopPropagation();
    var i=+b.getAttribute('data-i');
    if(a==='copy')copyImg(i);
    else if(a==='dl')dlImg(i);
    else{
      var x=imgsOf()[i];
      var src=x?x.src:'';
      if(!src){toast('没找到这张图，请重试');return;}
      if(insertAt(src)){switchTab('doc');toast('已插入正文 ✅ 想挪位置可长按选中');}
    }
  },true);
  if(list)new MutationObserver(inject).observe(list,{childList:true,subtree:true});

  /* ───────── 分页切换 ───────── */
  function scrollTopOf(v){
    var sc=(v==='doc')?document.querySelector('.doc-scroll'):document.querySelector('.img-body');
    if(sc)sc.scrollTop=0;
  }
  function switchTab(v){
    var tabs=document.querySelectorAll('.tab');
    for(var k=0;k<tabs.length;k++)tabs[k].classList.toggle('on',tabs[k].getAttribute('data-v')===v);
    var vd=$('viewDoc'),vi=$('viewImg');
    if(vd)vd.classList.toggle('on',v==='doc');
    if(vi)vi.classList.toggle('on',v==='img');
  }
  (function(){
    var tabs=document.querySelectorAll('.tab');
    for(var k=0;k<tabs.length;k++){
      (function(t){
        t.addEventListener('click',function(){
          var v=t.getAttribute('data-v');
          switchTab(v);
          if(v==='img')setTimeout(inject,60);
        });
      })(tabs[k]);
    }
  })();

  /* ───────── 抽屉 ───────── */
  function openSheet(id){var el=$(id);if(el)el.classList.add('on');}
  function closeSheet(el){
    while(el){
      if(el.classList&&el.classList.contains('sheet')){el.classList.remove('on');return;}
      el=el.parentNode;
    }
  }
  var fb=$('fmtBtn2'),mb=$('moreBtn');
  if(fb)fb.addEventListener('click',function(){openSheet('sheetFmt');});
  if(mb)mb.addEventListener('click',function(){openSheet('sheetMore');});
  (function(){
    var cs=document.querySelectorAll('[data-close]');
    for(var k=0;k<cs.length;k++){
      cs[k].addEventListener('click',function(){closeSheet(this);});
    }
  })();

  ['fFont','fSize'].forEach(function(id){
    var el=$(id);if(!el)return;
    el.addEventListener('change',function(){
      if(M.toast&&this.options&&this.options[this.selectedIndex])M.toast('已套用：'+this.options[this.selectedIndex].text);
    });
  });

  inject();
})();</script>
</body>
